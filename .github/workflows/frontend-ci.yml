name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Lint, type-check, test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Detect package scripts
        id: pkg
        working-directory: frontend
        run: |
          node -e '
          const fs = require("fs");
          const pkg = require("./package.json");
          const s = pkg.scripts || {};
          const out = [
            "has_lint=" + ("lint" in s),
            "has_type_check=" + ("type-check" in s),
            "has_build=" + ("build" in s),
            "has_test=" + ("test" in s)
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, out + "\n");'
      - name: Run lint
        if: steps.pkg.outputs.has_lint == 'true'
        run: npm run lint
        working-directory: frontend

      - name: Run TypeScript type-check
        if: steps.pkg.outputs.has_type_check == 'true'
        run: npm run type-check
        working-directory: frontend

      - name: Run tests
        if: steps.pkg.outputs.has_test == 'true'
        run: npm test
        working-directory: frontend

      - name: Build app
        run: npm run build
        working-directory: frontend
