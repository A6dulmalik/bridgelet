<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" role="img" aria-label="Bridgelet" width="36" height="36">
  <title>Bridgelet icon</title>
  <rect width="36" height="36" rx="8" fill="#0A1628"/>

  <!-- Dashed ring: ephemeral account -->
  <circle cx="12" cy="18" r="7" fill="none" stroke="#6C63FF" stroke-width="2.5" stroke-dasharray="3 2.2" stroke-linecap="round"/>

  <!-- Arrow connector -->
  <line x1="20" y1="18" x2="24" y2="18" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Solid ring: permanent wallet -->
  <circle cx="29" cy="18" r="5.5" fill="#6C63FF"/>
  <circle cx="29" cy="18" r="2.6" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
  <circle cx="29" cy="18" r="1" fill="#F59E0B"/>
</svg>
