<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 36" fill="none" role="img" aria-label="Bridgelet">
  <title>Bridgelet</title>

  <!-- Badge background -->
  <rect width="36" height="36" rx="8" fill="#0A1628"/>

  <!-- Dashed ring: ephemeral account -->
  <circle cx="13.5" cy="18" r="7.5"
    fill="none"
    stroke="#6C63FF"
    stroke-width="2"
    stroke-dasharray="3.2 2.2"
    stroke-linecap="round"/>

  <!-- Arrow connector -->
  <line x1="22" y1="18" x2="26.2" y2="18"
    stroke="#38BDF8"
    stroke-width="1.6"
    stroke-linecap="round"/>
  <polyline points="24.6,15.6 27.4,18 24.6,20.4"
    fill="none"
    stroke="#38BDF8"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Solid ring: permanent wallet -->
  <circle cx="31" cy="18" r="5.5" fill="#6C63FF"/>
  <circle cx="31" cy="18" r="2.6"
    fill="none"
    stroke="#0A1628"
    stroke-width="1.6"/>
  <circle cx="31" cy="18" r="1" fill="#38BDF8"/>

  <!-- Wordmark -->
  <text x="46" y="24.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="500" letter-spacing="-0.3" fill="#0A1628">bridgelet</text>
</svg>
