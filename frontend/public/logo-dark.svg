<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 36" fill="none" role="img" aria-label="Bridgelet">
  <!-- Icon mark: rounded square badge (slightly lighter on dark bg) -->
  <rect width="36" height="36" rx="8" fill="#1E3A5F"/>
  <!-- Origin dot (sender) -->
  <circle cx="9" cy="18" r="2.5" fill="#38BDF8"/>
  <!-- Destination ring (recipient, wallet) -->
  <circle cx="27" cy="18" r="3.5" stroke="#38BDF8" stroke-width="2" fill="none"/>
  <!-- Flow path: two lines converging into one -->
  <path d="M11.5 14 L20 18" stroke="#38BDF8" stroke-width="1.75" stroke-linecap="round"/>
  <path d="M11.5 22 L20 18" stroke="white" stroke-width="1.75" stroke-linecap="round" opacity="0.4"/>
  <line x1="20" y1="18" x2="23.3" y2="18" stroke="#38BDF8" stroke-width="1.75" stroke-linecap="round"/>
  <!-- Wordmark -->
  <text x="46" y="24.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="500" letter-spacing="-0.3" fill="#F8FAFC">bridgelet</text>
</svg>
