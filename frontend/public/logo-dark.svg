<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 44" fill="none" role="img" aria-label="Bridgelet">
  <!-- Icon: two arcs forming a bridge + forward arrow dot -->
  <!-- Left arc (source side) -->
  <path d="M4 34 C4 20 14 10 22 10 C30 10 36 16 36 22" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Right arc (destination side) -->
  <path d="M8 34 C8 22 18 14 22 14 C26 14 30 18 30 22" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Arrow dot -->
  <circle cx="38" cy="22" r="3" fill="#60A5FA"/>
  <!-- Arrow shaft -->
  <line x1="30" y1="22" x2="35" y2="22" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Wordmark -->
  <text x="52" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="600" letter-spacing="-0.5" fill="#F8FAFC">bridgelet</text>
</svg>
